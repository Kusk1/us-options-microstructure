name: Daily OpenBB Options Microstructure Update

on:
  schedule:
    # 周一至周五美股收盘后自动运行（UTC 23:00 = 美东冬令时 18:00 / 夏令时 19:00 = 北京时间次日 07:00，确保 CBOE 日终统计已出表）
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "历史回填交易日数（默认增量 10 天，首次可填 90）"
        required: false
        default: "10"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "options-microstructure-daily"
  cancel-in-progress: false

jobs:
  fetch-and-update:
    name: Fetch OpenBB & CBOE Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.12 and install dependencies
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: Run OpenBB daily data collector
        env:
          OPENBB_AUTO_BUILD: "true"
        run: |
          BACKFILL="${{ github.event.inputs.backfill_days || '10' }}"
          uv run python scripts/fetch_data.py --backfill-days "$BACKFILL"

      - name: Validate generated JSON files
        run: |
          uv run python -c "
          import json, pathlib
          latest = json.loads(pathlib.Path('docs/data/latest.json').read_text(encoding='utf-8'))
          hist = json.loads(pathlib.Path('docs/data/history.json').read_text(encoding='utf-8'))
          journal = json.loads(pathlib.Path('docs/data/journal.json').read_text(encoding='utf-8'))
          assert latest.get('asOfDate'), 'Missing asOfDate in latest.json'
          assert latest.get('dailyBrief'), 'Missing dailyBrief in latest.json'
          assert hist.get('count', 0) > 0, 'Empty history.json'
          assert len(journal.get('entries', [])) > 0, 'Empty journal.json'
          print(f\"Validated latest.json (asOf={latest['asOfDate']}, stress={latest['stressScore']}), history.json ({hist['count']}d), journal.json ({len(journal['entries'])} entries)\")
          "

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json docs/data/journal.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            AS_OF=$(uv run python -c "import json; print(json.load(open('docs/data/latest.json'))['asOfDate'])")
            git commit -m "chore(data): daily OpenBB microstructure update (${AS_OF})"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "docs"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: fetch-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
